# Application type (CLI, not web server)
# Required because Spring AI pulls in reactive web dependencies for streaming support
# Without this, Spring Boot fails looking for ReactiveWebServerFactory
# TODO: Re-evaluate when upgrading to Spring AI 2.x
spring.main.web-application-type=none

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-mini
spring.ai.openai.chat.options.temperature=1.0
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Logging
logging.level.org.springframework.ai=DEBUG
